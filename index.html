<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>学位绩点计算器</title>
    <meta name="theme-color" content="#FFF6E5" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/img/favicon-512x512.png" sizes="512x512" type="image/png" />
    <script>
      // 主题解析逻辑须与 src/stores/app.js 的 isDark computed 保持一致
      ;(function () {
        var theme = 'auto'
        try {
          var raw = localStorage.getItem('gpa_v2')
          if (raw) theme = (JSON.parse(raw).app || {}).theme || 'auto'
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
